version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: cliplink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: urlshortenerdb
      MYSQL_USER: clipuser
      MYSQL_PASSWORD: clip123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  cliplink:
    build: .
    container_name: cliplink-app
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/urlshortenerdb
      DB_USER: clipuser
      DB_PASSWORD: clip123

volumes:
  mysql_data: